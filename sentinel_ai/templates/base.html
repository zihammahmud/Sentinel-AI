<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sentinel AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    {% block head %}{% endblock %}
<base target="_blank">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-success">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-success" href="/">
                <span class="fs-4">&#128737;</span> SENTINEL AI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/network-builder' %}active{% endif %}" href="/network-builder">Network Builder</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/attack-simulation' %}active{% endif %}" href="/attack-simulation">Attack Simulation</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/ai-analysis' %}active{% endif %}" href="/ai-analysis">AI Analysis</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-success" id="system-status">SYSTEM ONLINE</span>
                    <span class="text-muted small" id="clock"></span>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-top border-secondary mt-5 py-3 text-center text-muted small">
        <div class="container">
            Sentinel AI &mdash; Intelligent Cyber Defense & Attack Simulation Platform | Classical AI Project
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
